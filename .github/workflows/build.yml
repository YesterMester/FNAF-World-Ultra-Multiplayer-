name: Build patcher

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build the native online extension once for both patchers
        run: python online/build_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: FWUM-Online-Extension
          path: |
            build/online/FWUMOnline.mfx
            build/online/FWUM-THIRD-PARTY-NOTICES.txt

  build:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: FWUM-Patcher-Windows
          - os: ubuntu-22.04
            name: FWUM-Patcher-Linux-SteamDeck
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: FWUM-Online-Extension
          path: build/online
      - name: Bundle the public lobby service address
        env:
          FWUM_RELAY_URL: ${{ vars.FWUM_RELAY_URL }}
        run: python -c "import os,pathlib; pathlib.Path('build/online/FWUM-server.txt').write_text(os.environ.get('FWUM_RELAY_URL', ''), encoding='utf-8')"
      - name: Tcl/Tk for the patcher window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tcl8.6 tk8.6
      - name: Install PyInstaller
        run: |
          python -m pip install pyinstaller==6.10.0 certifi==2024.8.30
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - name: Self-test (format code, no game files needed)
        run: python patcher/selftest.py
      - name: Build
        run: pyinstaller --onefile --windowed --name ${{ matrix.name }} --paths patcher --add-data "build/online/FWUMOnline.mfx:." --add-data "build/online/FWUM-server.txt:." --add-data "build/online/FWUM-THIRD-PARTY-NOTICES.txt:." --add-data "LICENSE:." patcher/patch.py
      - name: Check the Linux build starts
        if: runner.os == 'Linux'
        run: ./dist/${{ matrix.name }} --help
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Make the Linux build executable
        run: chmod +x dist/FWUM-Patcher-Linux-SteamDeck/*
      - name: Prepare checksums and release notes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          names = ['FWUM-Patcher-Windows.exe', 'FWUM-Patcher-Linux-SteamDeck']
          sums = []
          for name in names:
              path = next(p for p in Path('dist').rglob(name) if p.is_file())
              sums.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}\n')
          sha = os.environ['GITHUB_SHA']
          Path('dist/SHA256SUMS.txt').write_text(f'# Source commit: {sha}\n' + ''.join(sums))
          source = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/tree/{sha}"
          notes = Path('.github/RELEASE_NOTES.md').read_text()
          Path('release-notes.md').write_text(notes + f'\nSource: [{sha[:12]}]({source}).\n')
          PY
      - name: Advance the rolling latest tag to this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f "sha=$GITHUB_SHA" -F force=true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: FNaF World Ultra Multiplayer v1.1.1 — Keyboard focus and encounters
          body_path: release-notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/FWUM-Patcher-Windows/*
            dist/FWUM-Patcher-Linux-SteamDeck/*
            dist/SHA256SUMS.txt
            LICENSE
